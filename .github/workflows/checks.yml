# The gate for main: every pull request runs the full set, and main may only change through a pull request
# whose "checks" job passed (branch protection). The run on main after a merge repeats the fast part.
#
# The work runs on several machines side by side: one for the static checks and the test files, and on a pull request
# three more, each making a third of the deliberate breakages (run-breakages.js deals them, JITA_BREAK_PART). The job
# branch protection requires, "checks", only sums them up. A skipped job would count as passed for branch protection,
# so that one is never skipped: it always runs, and passes only when every job it waits for passed.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: static checks and test files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # layout-check.js measures the views in a real headless Chrome, which ubuntu-latest has preinstalled. Without a
      # browser it would skip; here it fails instead, and so does mutate-layout.js.
      JITA_LAYOUT_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the version check compares against the base branch

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Static checks (syntax, LF endings, em dashes, version bump, changelog history)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node tests/ci-static.js --base "origin/$BASE_REF"
          else
            node tests/ci-static.js
          fi

      - name: Test files
        run: node tests/run-checks.js

  breakages:
    name: breakages ${{ matrix.part }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false   # each part reports everything it found, not just the first part to fail
      matrix:
        part: ['0/3', '1/3', '2/3']
    env:
      JITA_LAYOUT_REQUIRED: '1'
      JITA_BREAK_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # mutate-releases.js runs the version history check

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deliberate breakages, part ${{ matrix.part }}
        run: node tests/run-breakages.js

  checks:
    name: checks
    needs: [tests, breakages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          TESTS: ${{ needs.tests.result }}
          BREAKAGES: ${{ needs.breakages.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "static checks and test files: $TESTS"
          echo "deliberate breakages: $BREAKAGES"
          test "$TESTS" = success
          if [ "$EVENT" = pull_request ]; then test "$BREAKAGES" = success; fi
